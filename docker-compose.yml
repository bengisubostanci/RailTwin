name: railtwin

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: railtwin
      POSTGRES_PASSWORD: railtwin
      POSTGRES_DB: railtwin
    volumes:
      - tsdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railtwin -d railtwin"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      MQTT_HOST: mosquitto
      TIME_SCALE: ${TIME_SCALE:-5}
      SPONTANEOUS_FAULTS: ${SPONTANEOUS_FAULTS:-true}
      FAULT_INTERVAL_S: ${FAULT_INTERVAL_S:-300}
    depends_on:
      - mosquitto
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://railtwin:railtwin@timescaledb:5432/railtwin
      REDIS_URL: redis://redis:6379/0
      MQTT_HOST: mosquitto
      MODEL_CACHE_DIR: /models
    volumes:
      - models:/models
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  tsdata:
  models:

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Aynı daldaki eski çalıştırmayı, yenisi başlayınca iptal et.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend testleri
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Bağımlılıkları kur
        run: pip install ./twin_core -r backend/requirements.txt pytest==8.3.4
      - name: Simülatörün sözdizimini kontrol et
        run: python -m py_compile simulator/main.py
      - name: Testleri çalıştır
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend derlemesi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Bağımlılıkları kur
        run: npm ci
      - name: Tip kontrolü ve derleme
        run: npm run build

  docker:
    name: Docker imajları
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tüm servis imajlarını derle
        run: docker compose build
